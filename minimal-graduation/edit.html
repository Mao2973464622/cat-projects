<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑商品 - 𝓒𝓲𝓪𝓵𝓵𝓸～(∠・ω< )⌒☆ 猫猫の前端毕设</title>
  <link rel="stylesheet" href="/Minimal/common.css">
  <link rel="stylesheet" href="/Minimal/form.css">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="nav-container">
      <h1 class="logo">𝓒𝓲𝓪𝓵𝓵𝓸～(∠・ω< )⌒☆ 猫猫の前端毕设</h1>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="list.html">商品列表</a>
        <a href="add.html">新增商品</a>
        <a href="developer.html">开发者说明</a>
      </div>
    </div>
  </nav>

  <!-- 编辑表单 -->
  <div class="container form-page">
    <h3 class="title">✏️ 编辑商品</h3>
    <form id="editForm" class="goods-form">
      <input type="hidden" name="id" id="editId">
      <div class="form-group">
        <label>商品名称 *</label>
        <input type="text" name="name" id="editName" placeholder="例如：红米耳机" required>
      </div>
      <div class="form-group">
        <label>商品分类 *</label>
        <select name="category" id="editCategory" required>
          <option value="">请选择分类</option>
          <option value="数码类">数码类</option>
          <option value="服饰类">服饰类</option>
          <option value="日用类">日用类</option>
          <option value="零食类">零食类</option>
        </select>
      </div>
      <div class="form-group">
        <label>商品价格（元）*</label>
        <input type="text" name="price" id="editPrice" placeholder="例如：99.9" required>
      </div>
      <div class="form-group">
        <label>图片链接（选填）</label>
        <input type="text" name="img_url" id="editImgUrl" placeholder="填写在线图片链接，如https://xxx.jpg">
      </div>
      <div class="form-group">
        <label>购买链接（选填）</label>
        <input type="text" name="buy_url" id="editBuyUrl" placeholder="填写商品购买链接">
      </div>
      <div class="form-group">
        <label>自用体验 *</label>
        <textarea name="experience" id="editExperience" rows="3" placeholder="说说使用感受～" required></textarea>
      </div>
      <div class="form-group">
        <label>小缺点 *</label>
        <textarea name="shortage" id="editShortage" rows="2" placeholder="说说不满意的地方～" required></textarea>
      </div>
      <div class="form-group">
        <label>评分（1-5星）*</label>
        <select name="score" id="editScore" required>
          <option value="1">1星</option>
          <option value="2">2星</option>
          <option value="3">3星</option>
          <option value="4">4星</option>
          <option value="5">5星</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn">保存修改</button>
        <a href="list.html" class="btn btn-danger">返回列表</a>
      </div>
    </form>
  </div>

  <!-- 底部 -->
  <footer>
    <p>𝓒𝓲𝓪𝓵𝓵𝓸～(∠・ω< )⌒☆ 猫猫の前端毕设 © 2026 | 湖南九嶷职业技术学院 毕设作品 | 前端展示</p>
  </footer>

  <script src="/Minimal/common.js"></script>
  <script src="/Minimal/crud.js"></script>
  <script>
    // 获取URL中的商品ID
    let urlParams = new URLSearchParams(window.location.search);
    let goodsId = urlParams.get('id');
    document.getElementById('editId').value = goodsId;

    // 价格输入验证
    document.getElementById('editPrice').addEventListener('input', priceInputFilter);

    // 加载商品数据到表单
    fetch('/Minimal/./goods.json')
      .then(res => res.json())
      .then(data => {
        let goods = data.find(item => item.id == goodsId);
        if (!goods) {
          showToast('商品不存在：纯前端受浏览器安全限制，无法直接修改本地goods.json');
          setTimeout(() => window.location.href = 'list.html', 2000);
          return;
        }

        // 填充表单
        document.getElementById('editName').value = goods.name;
        document.getElementById('editCategory').value = goods.category;
        document.getElementById('editPrice').value = goods.price;
        document.getElementById('editImgUrl').value = goods.img_url || '';
        document.getElementById('editBuyUrl').value = goods.buy_url || '';
        document.getElementById('editExperience').value = goods.experience;
        document.getElementById('editShortage').value = goods.shortage;
        document.getElementById('editScore').value = goods.score;
      });

    // 表单提交
    document.getElementById('editForm').addEventListener('submit', function(e) {
      e.preventDefault();
      let formData = {
        name: this.name.value,
        category: this.category.value,
        price: this.price.value,
        img_url: this.img_url.value,
        buy_url: this.buy_url.value,
        experience: this.experience.value,
        shortage: this.shortage.value,
        score: this.score.value
      };
      editGoods(formData, goodsId);
    });
  </script>
</body>
</html>
